services:
  - type: web
    name: bong-bong-party
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --prod
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BB_AUTH_SECRET
        generateValue: true
