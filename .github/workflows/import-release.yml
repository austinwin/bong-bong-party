name: Import and verify original Bubble Arena asset kit
on:
  push:
    branches: [reference-kit-integration]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Fetch complete source and all original graphics and audio
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --output /tmp/core.zip https://better-solstice.miniup.app/core.zip
          curl --fail --location --retry 4 --output /tmp/references-a.zip https://better-solstice.miniup.app/references-a.zip
          curl --fail --location --retry 4 --output /tmp/references-b.zip https://better-solstice.miniup.app/references-b.zip
          unzip -t /tmp/core.zip
          unzip -t /tmp/references-a.zip
          unzip -t /tmp/references-b.zip
          unzip -oq /tmp/core.zip -d .
          unzip -oq /tmp/references-a.zip -d .
          unzip -oq /tmp/references-b.zip -d .
          test -f frontend/assets/asset_manifest.json
          test -f frontend/assets/01_characters/duckling.png
          test -f frontend/assets/08_audio/bgm_lobby.wav
          rm -f .github/workflows/import-release.yml
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run multiplayer and asset verification tests
        run: |
          python -m pytest -q
          node --check frontend/game.js
      - name: Publish verified full source on integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate full original reference kit and multiplayer game"
          git push origin HEAD:reference-kit-integration
