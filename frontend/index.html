<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102536">
  <meta name="description" content="Bong Bong Party — đấu bóng nước cùng bạn bè.">
  <title>Bong Bong Party · Đấu bóng nước</title>
  <link rel="icon" href="/assets/05_water_balloons/balloon_01.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <header class="main-header">
      <button id="logo" class="brand" aria-label="Bong Bong Party, về sảnh">
        <span class="brand-icon"><img src="/assets/05_water_balloons/balloon_02.png" alt=""></span>
        <span>BONG BONG <b>PARTY</b></span>
      </button>
      <div class="header-actions">
        <span class="connection" id="serverStatus" role="status">Đang kết nối</span>
        <button id="audioSettings" class="blue-button" aria-expanded="false" aria-controls="soundPanel">♪ Âm thanh</button>
      </div>
      <section class="sound-panel panel" id="soundPanel" aria-label="Âm thanh" hidden>
        <div><button id="musicToggle" class="blue-button" aria-pressed="true">Nhạc nền</button><input aria-label="Âm lượng nhạc" type="range" id="musicVolume" min="0" max="100" value="55"></div>
        <div><button id="soundToggle" class="blue-button" aria-pressed="true">Hiệu ứng</button><input aria-label="Âm lượng hiệu ứng" type="range" id="sfxVolume" min="0" max="100" value="70"></div>
      </section>
    </header>
    <main>
      <section id="homeScreen" class="home-screen" aria-label="Sảnh chờ">
        <section class="lobby-art" aria-label="Đại chiến bóng nước">
          <div class="lobby-art-copy"><h1>Đại chiến<br><em>bóng nước</em></h1></div>
          <div class="lobby-scene" aria-hidden="true">
            <img class="hero-sprite crate" src="/assets/03_obstacles/wood_crate.png" alt="">
            <img class="hero-sprite shrub" src="/assets/03_obstacles/bush.png" alt="">
            <img class="hero-sprite duck" src="/assets/01_characters/duckling.png" alt="">
            <img class="hero-sprite frog" src="/assets/01_characters/frog_kid.png" alt="">
            <img class="hero-sprite berry" src="/assets/01_characters/berry_pixie.png" alt="">
            <img class="hero-sprite balloon" src="/assets/05_water_balloons/balloon_03.png" alt="">
          </div>
        </section>
        <div class="lobby-main">
          <section class="profile-panel panel">
            <h2 class="panel-heading">Chọn nhân vật</h2>
            <div class="profile-body">
              <div class="selected-character">
                <img id="selectedAvatar" src="/assets/01_characters/frog_kid.png" alt="">
                <strong id="selectedAvatarName">Ếch Xanh</strong>
              </div>
              <div id="avatarPicker" class="avatar-grid" aria-label="Chọn nhân vật"></div>
              <label class="input-caption" for="nickname">Biệt danh</label>
              <input class="field" id="nickname" maxlength="16" autocomplete="nickname" placeholder="Tên người chơi" disabled>
            </div>
          </section>
          <section class="rooms-panel panel">
            <h2 class="panel-heading">Sảnh chờ <span id="roomCount"></span></h2>
            <div class="rooms-body">
              <div class="lobby-actions">
                <button id="quickPlay" class="gold-button" disabled>Chơi nhanh</button>
                <button id="createRoom" class="blue-button" disabled>Tạo phòng</button>
                <button id="practice" class="blue-button" disabled>Tập chơi</button>
              </div>
              <div class="room-columns"><span>Mã phòng</span><span>Bản đồ</span><span>Người chơi</span><button id="refreshRooms" aria-label="Làm mới danh sách" title="Làm mới danh sách">↻</button></div>
              <div id="roomList" class="room-list"><p class="empty-list">Đang tải phòng…</p></div>
              <form id="joinForm" class="join-form">
                <label for="roomCode">Có mã mời?</label>
                <input class="field" id="roomCode" placeholder="ABC234" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Mã phòng">
                <button id="joinRoom" type="submit" class="sprite-btn sprite-join" aria-label="Vào phòng" disabled></button>
              </form>
            </div>
          </section>
        </div>
        <div class="lobby-help"><div id="itemPreview" class="item-preview" aria-label="Vật phẩm"></div></div>
      </section>

      <section id="gameScreen" class="game-screen" hidden>
        <div class="game-top panel">
          <div class="game-room-id"><strong id="matchTitle">Phòng chờ</strong><span id="roomTag">#<span id="currentRoom"></span></span></div>
          <div class="match-meters">
            <div class="hud-timer" aria-label="Thời gian"><span class="clock-face" aria-hidden="true"></span><strong id="timer">02:45</strong></div>
            <div class="hud-count" aria-label="Người chơi"><span class="people-icon" aria-hidden="true"></span><span id="matchCount"></span></div>
          </div>
          <div class="match-actions">
            <button id="shareRoom" class="blue-button">Mời bạn</button>
            <button id="leaveRoom" class="blue-button"><span aria-hidden="true">×</span> Thoát</button>
          </div>
        </div>
        <div class="game-body">
          <div class="play-panel panel">
            <div class="arena-wrap" id="arena" hidden>
              <div class="arena-board">
                <canvas id="gameCanvas" width="960" height="832" aria-label="Sân chơi đặt bóng nước" role="img"></canvas>
              </div>
            </div>
            <section id="boardOverlay" class="room-card" aria-labelledby="overlayTitle">
              <div class="panel-heading"><h2 id="overlayTitle">Phòng chờ</h2><span id="overlayDesc"></span></div>
              <div class="room-content">
                <div id="overlayPlayers" class="room-players" aria-label="Vị trí người chơi"></div>
                <div class="room-settings">
                  <label class="input-caption" for="mapPicker">Bản đồ</label>
                  <canvas id="mapPreview" width="240" height="208" aria-hidden="true"></canvas>
                  <select class="field" id="mapPicker"></select>
                  <div class="mode-row" id="modeButtons" aria-label="Chế độ">
                    <button class="blue-button" data-mode="teams">Đồng đội</button>
                    <button class="blue-button" data-mode="solo">Tự do</button>
                  </div>
                  <div class="room-card-actions">
                    <button id="readyButton" class="sprite-btn sprite-ready" aria-label="Sẵn sàng" hidden></button>
                    <button id="startGame" class="sprite-btn sprite-start" aria-label="Bắt đầu" disabled></button>
                  </div>
                  <p id="waitingNote" class="room-note">Đang kết nối phòng…</p>
                </div>
              </div>
            </section>
            <div class="play-controls" id="playControls" hidden>
              <div id="joystick" class="joystick" aria-label="Cần điều khiển di chuyển" role="group">
                <span class="stick-mark" data-direction="up" aria-hidden="true"></span>
                <span class="stick-mark" data-direction="left" aria-hidden="true"></span>
                <span class="stick-mark" data-direction="down" aria-hidden="true"></span>
                <span class="stick-mark" data-direction="right" aria-hidden="true"></span>
                <span class="stick-well" aria-hidden="true"></span>
                <span class="stick-knob" aria-hidden="true"></span>
              </div>
              <div class="control-center">
                <button id="zoomMap" class="blue-button" aria-pressed="true"><span class="map-icon" aria-hidden="true"></span><span id="cameraLabel">Theo nhân vật</span></button>
                <div class="keyboard-help"><span><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> Di chuyển</span><span><kbd>Space</kbd> Đặt bom</span></div>
                <div class="action-extras">
                  <button id="mobileThrow" class="blue-button" aria-label="Ném bóng" title="Ném bóng (R)" hidden><img src="/assets/04_powerups/glove.png" alt="">Ném</button>
                  <button id="mobileRemote" class="blue-button" aria-label="Kích nổ bóng" title="Kích nổ bóng (E)" hidden><img src="/assets/04_powerups/remote.png" alt="">Kích nổ</button>
                </div>
              </div>
              <button id="mobileBomb" class="bomb-action" aria-label="Đặt bóng nước"><img src="/assets/05_water_balloons/balloon_01.png" alt=""><span>Đặt bom</span></button>
            </div>
          </div>
          <aside class="game-side">
            <section class="panel roster-panel"><h2 class="panel-heading">Người chơi <span id="playerCounter">0 / 8</span></h2><div id="roster" class="roster"></div></section>
            <section class="panel stats-panel" id="statsPanel" hidden><h2 class="panel-heading">Vật phẩm</h2><div id="inventory" class="inventory"></div><p id="myStats" class="my-stats"></p></section>
            <section class="panel chat-panel"><h2 class="panel-heading">Trò chuyện</h2><div id="chatMessages" class="chat-log" role="log"></div><form id="chatForm" class="chat-entry"><input class="field" id="chatInput" maxlength="110" placeholder="Nhắn bạn bè…" autocomplete="off" aria-label="Tin nhắn"><button class="gold-button" type="submit">Gửi</button></form></section>
          </aside>
        </div>
      </section>
    </main>
  </div>
  <div id="gameToast" class="game-toast" role="status" hidden></div>
  <script type="module" src="/game.js"></script>
</body>
</html>
